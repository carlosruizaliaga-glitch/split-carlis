<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9822b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Split Carlis">
  <title>Split Carlis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root {
      --bg: #f7f3ee; --card: #ffffff; --text: #1f1b17; --muted: #6f675f; --line: #e8e0d6;
      --accent: #d9822b; --accent-ink: #ffffff; --accent-soft: #fbeedd; --pos: #1e7a46; --pos-soft: #e3f3ea;
      --neg: #b3261e; --neg-soft: #fbe9e7; --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151311; --card: #201d1a; --text: #f3efea; --muted: #a8a097; --line: #36312c;
        --accent: #f0a054; --accent-ink: #1f1300; --accent-soft: #3a2a19; --pos: #5fd08f; --pos-soft: #1a3325;
        --neg: #ff8a80; --neg-soft: #3a1f1d; --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    header { position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding: calc(10px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: center; gap: 10px; }
    header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    header h1 { margin: 0; font-size: 21px; }
    header .sub { color: var(--muted); font-size: 12px; }
    #syncBtn { margin-left: auto; background: none; padding: 6px 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
    .dot.ok { background: var(--pos); } .dot.warn { background: #e0a100; } .dot.err { background: var(--neg); }
    main { padding: 0 16px 24px; max-width: 640px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .hero { text-align: center; padding: 20px 14px; }
    .hero .big { font-size: 30px; font-weight: 800; margin: 4px 0; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-weight: 700; flex: none; font-size: 15px; }
    .avatar.sm { width: 26px; height: 26px; font-size: 11px; }
    .pos { color: var(--pos); } .neg { color: var(--neg); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.pos { background: var(--pos-soft); } .pill.neg { background: var(--neg-soft); }
    .pill.zero { background: var(--line); color: var(--muted); }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 6px; }
    .list > .item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
    .list > .item:first-child { border-top: 0; }
    .item.tap { cursor: pointer; }
    .emoji { font-size: 24px; width: 32px; text-align: center; flex: none; }
    .amount { text-align: right; font-weight: 600; white-space: nowrap; }
    button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
      background: var(--line); color: var(--text); font-weight: 600; }
    button.primary { background: var(--accent); color: var(--accent-ink); }
    button.danger { background: var(--neg-soft); color: var(--neg); }
    button.danger-solid { background: var(--neg); color: #fff; }
    button.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
    button.block { width: 100%; }
    button:disabled { opacity: .5; }
    .fab { position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom)); width: 58px; height: 58px;
      border-radius: 50%; font-size: 30px; padding: 0; background: var(--accent); color: var(--accent-ink);
      box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 6; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; background: var(--card);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav.tabs button { flex: 1; background: none; border-radius: 0; padding: 8px 0 10px; font-size: 11px;
      color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
    nav.tabs button .ic { font-size: 21px; line-height: 1.2; }
    nav.tabs button.active { color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
    input, select, textarea { font: inherit; font-size: 16px; width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .seg { display: flex; background: var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; padding: 8px 4px; border-radius: 9px; background: none; font-size: 14px; }
    .seg button.on { background: var(--card); box-shadow: var(--shadow); color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 6px 10px; font-size: 14px; border-radius: 99px; background: var(--line); font-weight: 500; }
    .chips button.on { background: var(--accent); color: var(--accent-ink); }
    .scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .scroll-x button { flex: none; }
    .split-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); margin: 0 !important; font-size: 16px !important; color: var(--text) !important; font-weight: 400 !important; }
    .split-row input[type=number] { width: 110px; text-align: right; }
    .split-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
    .hint { font-size: 13px; margin-top: 8px; font-weight: 600; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
      border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin: 0 0 4px; font-size: 19px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .actions button { flex: 1; }
    .overlay.dialog { z-index: 40; align-items: center; padding: 16px; }
    .dlg { background: var(--card); width: 100%; max-width: 360px; border-radius: 16px; padding: 18px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; }
    .colors button { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
    .colors button.on { border-color: var(--text); }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom));
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; font-size: 14px; max-width: 90vw; text-align: center; }
    .datehdr { font-size: 13px; color: var(--muted); font-weight: 700; margin: 16px 0 0; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .login { max-width: 400px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px 40px; text-align: center; }
    .login img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
    .login h1 { margin: 16px 0 4px; }
    .login .card { text-align: left; }
    .banner { background: var(--neg-soft); color: var(--neg); border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; font-weight: 600; }
    body.noapp header, body.noapp nav.tabs, body.noapp .fab { display: none; }
  </style>
</head>
<body class="noapp">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>Split Carlis</h1><div class="sub" id="subtitle"></div></div>
    <button id="syncBtn" aria-label="Sincronizar"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></button>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Añadir gasto">+</button>
  <nav class="tabs">
    <button data-tab="balance" class="active"><span class="ic">⚖️</span>Saldo</button>
    <button data-tab="moves"><span class="ic">🧾</span>Gastos</button>
    <button data-tab="stats"><span class="ic">📊</span>Resumen</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Ajustes</button>
  </nav>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="defaults.js"></script>
  <script src="app.js"></script>
</body>
</html>
